<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid container">
      <span class="navbar-brand mb-0 h1">Personal Expense Tracker</span>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-1">Financial Dashboard</h2>
    <p class="text-muted mb-4">Manage your income and expenses in one place.</p>

    <!-- Summary Cards -->
    <div class="row mb-4">
      <div class="col-md-4 mb-2">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="card-title text-muted">Total Income</h6>
            <h4 id="total-income">LKR 0.00</h4>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-2">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="card-title text-muted">Total Expenses</h6>
            <h4 id="total-expense">LKR 0.00</h4>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-2">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="card-title text-muted">Current Balance</h6>
            <h4 id="current-balance">LKR 0.00</h4>
          </div>
        </div>
      </div>
    </div>

    <!-- Transaction Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-4">Add a Transaction</h5>
        <form id="transaction-form">
          <div class="row mb-3">
            <div class="col-md-6 mb-3">
              <label class="form-label">Transaction Type</label>
              <select id="type" class="form-select" required>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Description</label>
              <input type="text" id="description" class="form-control" placeholder="e.g. Monthly allowance" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Amount (LKR)</label>
              <input type="number" id="amount" class="form-control" placeholder="Enter amount" min="0.01" step="0.01" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="">Select a category</option>
                <option value="Allowance">Allowance</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Salary">Salary</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Transaction Date</label>
              <input type="date" id="date" class="form-control" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add Transaction</button>
          <button type="button" id="clear-btn" class="btn btn-light border">Clear Form</button>
        </form>
      </div>
    </div>

    <!-- Transaction History -->
    <div class="card shadow-sm mb-5">
      <div class="card-body">
        <h5 class="card-title mb-3">Transaction History</h5>
        <div class="row mb-3">
          <div class="col-md-4 mb-2">
            <label class="form-label text-muted small">Filter by Type</label>
            <select id="filter-type" class="form-select">
              <option value="All">All Transactions</option>
              <option value="Income">Income</option>
              <option value="Expense">Expense</option>
            </select>
          </div>
          <div class="col-md-8 mb-2">
            <label class="form-label text-muted small">Search Transactions</label>
            <input type="text" id="search-input" class="form-control" placeholder="Search by description or category">
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-borderless table-striped align-middle">
            <thead class="table-light text-muted small">
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Type</th>
                <th>Category</th>
                <th>Amount (LKR)</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="transaction-list">
              <!-- Transactions will be injected here -->
            </tbody>
          </table>
          <div id="no-data" class="text-center text-muted small py-3 d-none">No transactions found.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
